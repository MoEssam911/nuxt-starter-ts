name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # ✅ Quality gate
      - run: npm run check

      # ✅ Build
      - name: Build
        env:
          NITRO_PRESET: netlify
        run: npm run build

      # 🔥 Determine deploy target
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_PROD }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--prod" >> $GITHUB_ENV
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV

          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_STAGING }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--alias staging" >> $GITHUB_ENV
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV

          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_DEV }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--alias develop" >> $GITHUB_ENV
            echo "ENV_FILE=.env.development" >> $GITHUB_ENV
          fi

      # 🚀 Deploy only on specific branches
      - name: Deploy
        if: env.SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx netlify deploy \
            --dir=.netlify \
            --site=$SITE_ID \
            $DEPLOY_CMD
