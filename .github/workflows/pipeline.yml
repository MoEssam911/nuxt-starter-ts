name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, staging, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# 🔥 Move this to the top so ALL steps know we are building for Netlify
env:
  NITRO_PRESET: netlify

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # ✅ Quality Gate
      - name: Run Checks
        run: npm run check

      # 🔥 Determine deploy target and set Environment File
      - name: Set Environment Configuration
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_PROD }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--prod" >> $GITHUB_ENV
            echo "ENV_FILE=.env.production" >> $GITHUB_ENV

          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_STAGING }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--alias staging" >> $GITHUB_ENV
            echo "ENV_FILE=.env.staging" >> $GITHUB_ENV

          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "SITE_ID=${{ secrets.NETLIFY_SITE_ID_DEV }}" >> $GITHUB_ENV
            echo "DEPLOY_CMD=--alias develop" >> $GITHUB_ENV
            echo "ENV_FILE=.env.development" >> $GITHUB_ENV
          fi

      # 🏗️ Build the Project (This is the ONLY build that will run now)
      - name: Build Project
        run: npx nuxi build --dotenv ${{ env.ENV_FILE }}

      # 🚀 Deploy to the correct Netlify Site
      - name: Deploy to Netlify
        if: env.SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx netlify deploy \
            --dir=.output/public \
            --site=$SITE_ID \
            ${{ env.DEPLOY_CMD }}
