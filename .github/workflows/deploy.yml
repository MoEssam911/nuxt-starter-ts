name: Deploy to Netlify (CD)

on:
  push:
    branches:
      - main
      - staging
      - develop

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine Environment Settings
        id: env_setup
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "DEPLOY_CMD=netlify deploy --prod" >> $GITHUB_ENV
            echo "NUXT_MODE=production" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/staging" ]; then
            echo "DEPLOY_CMD=netlify deploy --alias staging" >> $GITHUB_ENV
            echo "NUXT_MODE=staging" >> $GITHUB_ENV
          elif [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "DEPLOY_CMD=netlify deploy --alias develop" >> $GITHUB_ENV
            echo "NUXT_MODE=development" >> $GITHUB_ENV
          fi

      - name: Build Nuxt App
        env:
          NITRO_PRESET: netlify
        # This will automatically pick up the .env.[mode] file based on the NUXT_MODE variable
        run: npx nuxt build --dotenv .env.${{ env.NUXT_MODE }}

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # The deployment command changes based on the branch (e.g., prod vs alias)
        # Nuxt netlify preset outputs to .netlify directory
        run: npx ${{ env.DEPLOY_CMD }} --build false --dir=.netlify
